name: Backfill image attestation
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Image name without tag
        required: true
        default: us-west1-docker.pkg.dev/devopsre/op-conductor-ops/op-conductor-ops
      image_tag:
        description: Image tag
        required: true
        default: v0.2.0
permissions:
  contents: read

jobs:
  attest-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
        id: auth1
        with:
          workload_identity_provider: projects/1094498259535/locations/global/workloadIdentityPools/gh-optimism-infra/providers/github-by-repos
          service_account: optimism-infra@devopsre.iam.gserviceaccount.com
          token_format: access_token
      - name: Auth w/ registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: us-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth1.outputs.access_token }}
      - name: Set up crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - name: Resolve image digest
        id: digest
        run: |
          digest="$(crane digest "${{ inputs.image_name }}:${{ inputs.image_tag }}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "$digest"
      - name: Echo
        run: |
          echo "${{ inputs.image_name }}"
          echo "${{ steps.digest.outputs.digest }}"
      - name: Attest image
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ inputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
