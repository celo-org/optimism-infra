[server]
rpc_port = 8545

[backend]
response_timeout_seconds = 1

[backends]
[backends.node1]
rpc_url = "$NODE1_URL"
max_blocks_back = 16

[backends.node2]
rpc_url = "$NODE2_URL"

[backend_groups]
[backend_groups.node]
backends = ["node1", "node2"]
routing_strategy = "consensus_aware"
consensus_handler = "noop" # the test drives consensus updates
consensus_min_peer_count = 4

[rpc_method_mappings]
eth_getBalance = "node"
